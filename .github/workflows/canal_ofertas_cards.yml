name: Canal Ofertas - Cards + Telegram

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  generar_cards_y_enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar FFmpeg y fuentes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Instalar dependencias de Node
        run: npm install

      - name: Obtener ofertas
        id: obtener
        env:
          OFERTAS_JSON_URL: ${{ vars.OFERTAS_JSON_URL }}
        run: node scripts/obtener_ofertas.js

      - name: Generar cards de ofertas
        env:
          OFERTAS_JSON_URL: ${{ vars.OFERTAS_JSON_URL }}
        run: node scripts/generar_card_oferta.js

      - name: Enviar cards y guión a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OFERTAS_JSON_URL: ${{ vars.OFERTAS_JSON_URL }}
        run: node scripts/enviar_telegram_ofertas.js

      - name: Marcar ofertas como usadas
        run: node scripts/marcar_ofertas_usadas.js

      - name: Guardar ofertas ya usadas
        run: |
          git config user.name "youtube-auto-bot"
          git config user.email "actions@github.com"
          git add data/ofertas_procesadas.json
          git commit -m "Actualiza ofertas ya usadas" || echo "Sin cambios que guardar"
          git pull --rebase --autostash origin main || true
          git push || echo "No se pudo guardar esta vez"
