name: Reporte semanal de progreso (YouTube)

permissions:
  contents: write

on:
  schedule:
    - cron: "0 13 * * 1" # lunes 8am hora Colombia
  workflow_dispatch:

jobs:
  reporte_semanal:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generar y enviar reporte semanal
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/reporte_semanal.js

      - name: Guardar snapshot del reporte
        if: always()
        run: |
          git config user.name "youtube-auto-bot"
          git config user.email "actions@github.com"
          git add reportes/
          git commit -m "Actualizar snapshot del reporte semanal" || echo "Sin cambios que guardar"
          git pull --rebase --autostash origin main || true
          git push || echo "No se pudo guardar el snapshot esta vez, no es grave"
