name: Canal Ofertas - Video Automático

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  generar_video_ofertas:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg y fuentes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Instalar dependencias de Node
        run: npm install

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      # ── PASO 1: Obtener ofertas ──
      - name: Obtener ofertas
        id: ofertas
        env:
          OFERTAS_JSON_URL: ${{ vars.OFERTAS_JSON_URL }}
        run: node scripts/obtener_ofertas.js

      # ── PASO 2: Generar cards profesionales ──
      - name: Generar cards de ofertas
        id: cards
        env:
          OFERTAS_JSON_URL: ${{ vars.OFERTAS_JSON_URL }}
        run: node scripts/generar_card_oferta.js

      # ── PASO 2b: Validar que al menos 1 card exista ──
      - name: Validar cards generadas
        run: |
          cards=$(ls output/cards/card_*.jpg 2>/dev/null | wc -l)
          echo "Cards generadas: $cards"
          if [ "$cards" -eq 0 ]; then
            echo "No se generó ninguna card. No hay con qué armar el video."
            exit 1
          fi
          echo "Hay $cards cards para procesar"

      # ── PASO 3: Generar narración para TTS ──
      - name: Generar narración
        id: narracion
        env:
          OFERTAS_JSON_URL: ${{ vars.OFERTAS_JSON_URL }}
        run: node scripts/generar_narracion_ofertas.js

      # ── PASO 4: Copiar cards como escenas para ensamblar_video ──
      - name: Preparar escenas (cards → imagenes)
        run: |
          rm -rf output/imagenes
          mkdir -p output/imagenes
          for card in output/cards/card_*.jpg; do
            num=$(basename "$card" | sed 's/card_//;s/.jpg//')
            cp "$card" "output/imagenes/escena_${num}.jpg"
          done
          echo "Escenas preparadas:"
          ls output/imagenes/

      # ── PASO 5: Generar audio con TTS ──
      - name: Generar audio y subtítulos
        id: audio
        run: python scripts/generar_audio.py

      # ── PASO 6: Ensamblar video ──
      - name: Ensamblar video
        id: video
        run: node scripts/ensamblar_video.js

      # ── PASO 6b: Validar que el video exista ──
      - name: Validar video generado
        run: |
          if [ ! -f "output/video_final.mp4" ]; then
            echo "No se generó el video final"
            exit 1
          fi
          size=$(stat -c%s "output/video_final.mp4" 2>/dev/null || stat -f%z "output/video_final.mp4")
          echo "Video generado: $(($size / 1048576)) MB"

      # ── PASO 7: Subir a YouTube ──
      - name: Preparar credenciales YouTube
        run: |
          mkdir -p config
          echo '${{ secrets.YT_CREDENTIALS_JSON }}' > config/credentials.json
          echo '${{ secrets.YT_TOKEN_JSON }}' > config/token.json
          echo "Credenciales YouTube preparadas"

      - name: Subir a YouTube
        id: youtube
        run: node scripts/subir_youtube.js

      # ── PASO 8: Subir a Facebook Reels ──
      - name: Subir a Facebook Reels
        id: facebook
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID_TECNOLOGIA }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN_TECNOLOGIA }}
        run: node scripts/subir_facebook.js

      # ── PASO 9: Marcar ofertas como usadas ──
      - name: Marcar ofertas como usadas
        run: node scripts/marcar_ofertas_usadas.js

      # ── PASO 10: Guardar cambios en git ──
      - name: Guardar ofertas ya usadas
        run: |
          git config user.name "youtube-auto-bot"
          git config user.email "actions@github.com"
          git add data/ofertas_procesadas.json
          git commit -m "Actualiza ofertas ya usadas" || echo "Sin cambios que guardar"
          git stash || true
          git pull --rebase origin main || true
          git stash pop || true
          git push || echo "No se pudo guardar esta vez"

      # ── PASO 11: Notificar por Telegram ──
      - name: Notificar por Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notificar_telegram.js

      # ── PASO 12: Enviar respaldo si YouTube falló ──
      - name: Enviar video de respaldo a Telegram
        if: failure() && steps.youtube.outcome == 'failure'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/enviar_telegram_respaldo.js
