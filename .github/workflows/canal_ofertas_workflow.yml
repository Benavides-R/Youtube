name: Canal Ofertas - Video Automático

permissions:
  contents: write

on:
  # schedule suspendido -- GitHub lo corre con horas de atraso variable.
  # Se dispara por fuera con cron-job.org a las 8:00pm y 9:20pm Colombia.
  workflow_dispatch:

jobs:
  generar_y_subir_video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg y fuentes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Instalar dependencias de Node
        run: npm install

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Obtener ofertas y armar guion + imágenes
        id: obtener
        env:
          OFERTAS_JSON_URL: ${{ vars.OFERTAS_JSON_URL }}
        run: node scripts/obtener_ofertas.js

      - name: Generar audio y subtítulos
        run: python scripts/generar_audio.py

      - name: Ensamblar video
        run: node scripts/ensamblar_video.js

      - name: Subir a Facebook Reels
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID_TECNOLOGIA }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN_TECNOLOGIA }}
        run: node scripts/subir_facebook.js

      - name: Marcar ofertas como usadas (solo si sí se publicó)
        run: node scripts/marcar_ofertas_usadas.js

      - name: Guardar ofertas ya usadas
        run: |
          git config user.name "youtube-auto-bot"
          git config user.email "actions@github.com"
          git add data/ofertas_procesadas.json
          git commit -m "Actualiza ofertas ya usadas en video" || echo "Sin cambios que guardar"
          git pull --rebase origin main || true
          git push || echo "No se pudo guardar esta vez, no es grave, seguimos"

      - name: Notificar por Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notificar_telegram.js
